<!doctype html><meta charset="utf-8"><script type="module">
import {conformCADMesh,validateMesh,binarySTL,readSTL} from '../mesh.js';
import {parameters,DEFAULTS,threadSeams} from '../parameters.js';
import {inspectDimensions} from './measurements.js';
try{
  const source=await(await fetch('./debug-mesh.json')).json();
  const tolerance=Number(new URLSearchParams(location.search).get('tolerance')||.002);
  const p=parameters(DEFAULTS);
  const circularSeams=threadSeams(p);
  const {mesh,repair}=conformCADMesh(source,tolerance,{circularSeams}),report=validateMesh(mesh,{details:true}),stl=validateMesh(readSTL(binarySTL(mesh)));
  if(!report.ok)await fetch('/artifact/debug-conformed.json',{method:'POST',body:JSON.stringify(mesh)});
  try{inspectDimensions(mesh,parameters(DEFAULTS));}catch(e){report.dimensionError=String(e);}
  await fetch('/test-result',{method:'POST',body:JSON.stringify({done:true,ok:report.ok&&stl.ok,report,repair,stl})});
}catch(e){await fetch('/test-result',{method:'POST',body:JSON.stringify({done:true,ok:false,error:String(e.stack||e)})});}
</script>
